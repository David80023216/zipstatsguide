<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZIP Code Not Found | ZipStatsGuide</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.card{background:white;border-radius:16px;padding:48px 40px;max-width:480px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.07)}
.icon{font-size:4rem;margin-bottom:16px}
h1{font-size:1.6rem;color:#1e293b;margin-bottom:8px}
p{color:#64748b;margin-bottom:24px;line-height:1.6}
.search-box{display:flex;gap:8px;margin-bottom:16px}
.search-box input{flex:1;padding:12px 16px;border-radius:8px;border:1.5px solid #e2e8f0;font-size:1rem;outline:none}
.search-box input:focus{border-color:#2563eb}
.search-box button{background:#2563eb;color:white;font-weight:700;padding:12px 20px;border-radius:8px;border:0;cursor:pointer;font-size:1rem}
.search-box button:hover{background:#1d4ed8}
a.home{display:inline-block;color:#2563eb;text-decoration:none;font-size:.9rem}
a.home:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔍</div>
  <h1>ZIP Code Not Found</h1>
  <p>That ZIP code doesn't exist in our database. It may be unassigned or invalid. Try another one below.</p>
  <div class="search-box">
    <input type="text" id="zip-input" placeholder="Enter a ZIP code..." maxlength="5" onkeydown="if(event.key==='Enter')goZip()"/>
    <button onclick="goZip()">Search</button>
  </div>
  <a class="home" href="/zipstatsguide/">← Back to ZipStatsGuide</a>
</div>
<script>
function goZip(){
  var v=document.getElementById('zip-input').value.trim();
  if(/^\d{5}$/.test(v)) window.location.href='/zipstatsguide/zip/'+v+'.html';
  else alert('Please enter a valid 5-digit ZIP code.');
}
</script>
</body>
</html>
